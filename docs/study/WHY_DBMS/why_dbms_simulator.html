<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>파일 직접 vs DBMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#ECEFF3; --panel:#FFFFFF; --ink:#18202B; --sub:#55606E; --line:#CBD2DB;
  --blue:#2457A6; --bluebg:#E1EAF7; --red:#B9362B; --redbg:#F8E3E0;
  --dbms:#1E6E5E; --dbmsbg:#DDF0EA; --chip:#E3E7EC; --focus:#2457A6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#11161D; --panel:#1A212B; --ink:#E7ECF2; --sub:#9AA6B4; --line:#2E3946;
    --blue:#7FA7E6; --bluebg:#1C2B42; --red:#F08A7E; --redbg:#3A1F1C;
    --dbms:#6CC7B3; --dbmsbg:#173430; --chip:#252E3A; --focus:#7FA7E6;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#11161D; --panel:#1A212B; --ink:#E7ECF2; --sub:#9AA6B4; --line:#2E3946;
  --blue:#7FA7E6; --bluebg:#1C2B42; --red:#F08A7E; --redbg:#3A1F1C;
  --dbms:#6CC7B3; --dbmsbg:#173430; --chip:#252E3A; --focus:#7FA7E6;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",sans-serif;font-size:15px;line-height:1.55;word-break:keep-all;}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 48px;}
h1{font-size:28px;line-height:1.25;margin:0 0 6px;font-weight:700;}
.lede{color:var(--sub);margin:0 0 22px;max-width:66ch;}
button{font:inherit;color:inherit;cursor:pointer;}
button:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}
.topbar{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:18px;}
.mode{display:inline-flex;background:var(--chip);border-radius:10px;padding:4px;gap:4px;}
.mode button{border:0;background:transparent;padding:8px 16px;border-radius:7px;font-weight:600;color:var(--sub);}
.mode button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line);}
.reset{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:8px;}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.tabs [role="tab"]{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:8px;font-weight:500;}
.tabs [role="tab"][aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.tabs.more{align-items:center;margin-top:-4px;margin-bottom:16px;}
.tabs.more [role="tab"]{border-style:dashed;padding:5px 10px;font-size:13px;color:var(--sub);}
.tabs.more [role="tab"][aria-selected="true"]{color:var(--bg);border-style:solid;}
.tabnote{font-size:12px;color:var(--sub);margin-right:4px;}
.lede a{color:var(--blue);}
.layout{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start;}
@media (max-width:880px){.layout{grid-template-columns:1fr;}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;}
.scenario h2{font-size:18px;margin:0 0 6px;}
.scenario p{margin:0 0 12px;color:var(--sub);}
.scenario .watch{background:var(--chip);border-radius:8px;padding:10px 12px;font-size:14px;}
.actions{display:flex;flex-direction:column;gap:8px;margin:14px 0;}
.actions button{border:1px solid var(--blue);background:var(--bluebg);padding:10px 12px;border-radius:9px;text-align:left;font-weight:500;}
.actions button:disabled{opacity:.45;cursor:not-allowed;}
.who{font-size:12px;color:var(--sub);display:block;font-weight:400;}
.topo{display:flex;flex-direction:column;gap:10px;}
.tierlabel{font-size:12px;color:var(--sub);text-align:center;}
.progs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;}
.prog{border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel);text-align:center;transition:border-color .2s;}
.prog b{display:block;font-size:14px;}
.prog small{display:block;font-size:12px;color:var(--sub);min-height:18px;}
.prog.active{border-color:var(--blue);}
.prog.broken{border-color:var(--red);background:var(--redbg);}
.prog.broken small{color:var(--red);font-weight:600;}
.prog.ok small{color:var(--blue);font-weight:600;}
.down{width:2px;height:16px;background:var(--line);margin:0 auto;}
.via{font-size:12px;color:var(--sub);text-align:center;font-family:"IBM Plex Mono",ui-monospace,monospace;}
.files{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;}
.file{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--chip);min-height:96px;}
.file h3{margin:0 0 6px;font-size:14px;font-family:"IBM Plex Mono",ui-monospace,monospace;display:flex;justify-content:space-between;gap:6px;}
.file h3 .tag{font-family:inherit;font-size:11px;font-weight:500;color:var(--sub);}
.file.stale,.file.broken{border-color:var(--red);background:var(--redbg);}
.file.stale h3 .tag,.file.broken h3 .tag{color:var(--red);font-weight:600;}
.lines{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12.5px;display:flex;flex-direction:column;gap:2px;}
.lines .bad{color:var(--red);font-weight:600;}
.lines .new{color:var(--blue);font-weight:600;}
.dbmsbox{border:2px solid var(--dbms);border-radius:12px;padding:12px;background:var(--panel);}
.dbmsbox > h3{margin:0 0 4px;font-size:15px;color:var(--dbms);}
.dbmsbox > p{margin:0 0 10px;font-size:12px;color:var(--sub);}
.tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;}
.tbl{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:12.5px;}
.tbl .tn{background:var(--dbmsbg);color:var(--dbms);font-weight:700;padding:5px 8px;font-family:"IBM Plex Mono",ui-monospace,monospace;}
.tbl table{border-collapse:collapse;width:100%;}
.tbl th,.tbl td{padding:4px 8px;border-top:1px solid var(--line);text-align:left;font-family:"IBM Plex Mono",ui-monospace,monospace;}
.tbl th{color:var(--sub);font-weight:500;}
.tbl td.new,.tbl th.new{color:var(--blue);font-weight:700;}
.disk{margin-top:8px;font-size:12px;color:var(--sub);text-align:center;}
.extra{margin-top:10px;}
.bar{height:22px;border-radius:6px;background:var(--chip);position:relative;overflow:hidden;border:1px solid var(--line);}
.bar span{position:absolute;left:0;top:0;bottom:0;background:var(--red);opacity:.75;}
.bar.idx span{background:var(--dbms);}
.barlabel{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin:4px 0 10px;}
.tree{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;}
.tree div{border:1px solid var(--dbms);border-radius:6px;padding:3px 10px;background:var(--dbmsbg);}
.qlist{display:flex;flex-direction:column;gap:8px;}
.q{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--chip);font-size:13px;}
.q pre{margin:6px 0 0;white-space:pre-wrap;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;}
.steps{display:flex;flex-direction:column;gap:4px;font-size:13px;}
.steps div{display:grid;grid-template-columns:90px 1fr;gap:8px;border-bottom:1px dashed var(--line);padding:3px 0;}
.steps .t{color:var(--sub);font-family:"IBM Plex Mono",ui-monospace,monospace;}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px;}
.stat{background:var(--chip);border-radius:10px;padding:10px 12px;}
.stat b{display:block;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:22px;}
.stat b.bad{color:var(--red);}
.stat small{color:var(--sub);}
@media (max-width:560px){.stats{grid-template-columns:1fr;}}
.result{margin-top:14px;border-radius:10px;padding:12px 14px;font-weight:600;display:none;}
.result.show{display:block;}
.result.bad{background:var(--redbg);color:var(--red);}
.result.good{background:var(--bluebg);color:var(--blue);}
.result.neutral{background:var(--chip);color:var(--ink);}
.log{margin-top:18px;}
.log h2{font-size:16px;margin:0 0 8px;}
.log ol{list-style:none;margin:0;padding:0;max-height:240px;overflow:auto;font-size:13px;}
.log li{padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;}
.log li .n{color:var(--sub);font-family:"IBM Plex Mono",ui-monospace,monospace;min-width:28px;}
.log li.bad{color:var(--red);}
.log li.good{color:var(--blue);}
code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.92em;}
@keyframes ping{from{box-shadow:0 0 0 0 var(--blue);}to{box-shadow:0 0 0 10px transparent;}}
.prog.ping{animation:ping .6s ease-out;}
@media (prefers-reduced-motion: reduce){.prog.ping{animation:none;}.prog{transition:none;}}
</style>
</head>
<body>
<div class="wrap">
  <h1>같은 파일을 여러 코드가 직접 쓰면 vs DBMS에 부탁하면</h1>
  <p class="lede">order.py, report.py, delivery.py가 같은 주문 데이터를 함께 씁니다. 위에서 방식을 바꿔 가며 같은 버튼을 눌러 보세요. <b>파일 직접</b>은 코드마다 파일을 직접 열고 쓰는 방식, <b>DBMS</b>는 모든 코드가 SQL로 DBMS에 부탁하고 파일은 DBMS만 여는 방식입니다. 문제 1·2·3은 <a href="./WHY_DBMS.md">왜 DBMS인가</a>의 문제 1·2·3과 같습니다.</p>
  <div class="topbar">
    <div class="mode" role="group" aria-label="데이터 관리 방식">
      <button type="button" data-mode="file" aria-pressed="true">파일 직접 (코드마다 파일을 엶)</button>
      <button type="button" data-mode="dbms" aria-pressed="false">DBMS (SQL로 부탁)</button>
    </div>
    <button type="button" class="reset" id="reset">처음 상태로</button>
  </div>
  <div class="tabs" role="tablist" aria-label="핵심 문제">
    <button role="tab" data-s="2" aria-selected="true">문제 1 · 칸 추가</button>
    <button role="tab" data-s="4" aria-selected="false">문제 2 · 100만 건에서 찾기</button>
    <button role="tab" data-s="5" aria-selected="false">문제 3 · 동시에 사기</button>
  </div>
  <div class="tabs more" role="tablist" aria-label="차별화 후보">
    <span class="tabnote">차별화 후보 (과제 필수 아님)</span>
    <button role="tab" data-s="1" aria-selected="false">A · 주소가 두 파일에</button>
    <button role="tab" data-s="3" aria-selected="false">B · 새 질문마다 코드</button>
    <button role="tab" data-s="6" aria-selected="false">C · 저장하다 꺼짐</button>
  </div>
  <div class="layout">
    <div class="panel scenario" id="scenario" role="tabpanel"></div>
    <div class="panel">
      <div class="topo">
        <div class="tierlabel">코드</div>
        <div class="progs" id="progs"></div>
        <div class="down"></div>
        <div class="via" id="via"></div>
        <div class="down"></div>
        <div id="storage"></div>
        <div class="extra" id="extra"></div>
      </div>
      <div class="stats" id="stats"></div>
      <div class="result" id="result" role="status" aria-live="polite"></div>
    </div>
  </div>
  <div class="panel log">
    <h2>기록</h2>
    <ol id="log"></ol>
  </div>
</div>
<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); };
var won = function(n){ return n.toLocaleString("ko-KR") + "원"; };

var mode = "file", scene = 2, st = {}, logN = 0, active = null;

/* ---------- 공통 그리기 ---------- */
function fileBox(name, lines, opt){
  opt = opt || {};
  var cls = "file" + (opt.stale ? " stale" : "") + (opt.broken ? " broken" : "");
  var tag = opt.tag ? '<span class="tag">' + esc(opt.tag) + '</span>' : "";
  var body = lines.length ? lines.map(function(l){
    if (typeof l === "string") return "<div>" + esc(l) + "</div>";
    return '<div class="' + l.c + '">' + esc(l.t) + "</div>";
  }).join("") : '<div style="color:var(--sub)">(비어 있음)</div>';
  return '<div class="' + cls + '"><h3><span>' + esc(name) + "</span>" + tag + '</h3><div class="lines">' + body + "</div></div>";
}
function table(name, cols, rows, opt){
  opt = opt || {};
  var newCol = opt.newCol, newRow = opt.newRow;
  var h = '<div class="tbl"><div class="tn">' + esc(name) + "</div><table><tr>" +
    cols.map(function(c){ return '<th class="' + (c === newCol ? "new" : "") + '">' + esc(c) + "</th>"; }).join("") + "</tr>";
  if (!rows.length) h += '<tr><td colspan="' + cols.length + '" style="color:var(--sub)">(비어 있음)</td></tr>';
  rows.forEach(function(r, i){
    h += "<tr>" + r.map(function(v, j){
      var n = (cols[j] === newCol) || (i === newRow);
      return '<td class="' + (n ? "new" : "") + '">' + esc(v) + "</td>";
    }).join("") + "</tr>";
  });
  return h + "</table></div>";
}
function dbmsBox(tablesHtml, note){
  return '<div class="dbmsbox"><h3>DBMS</h3><p>' + esc(note || "파일은 DBMS만 직접 만집니다. 프로그램은 SQL로 부탁합니다.") +
    '</p><div class="tables">' + tablesHtml + '</div><div class="disk">↓ 디스크의 파일 (DBMS만 접근)</div></div>';
}
function log(msg, cls){
  logN += 1;
  var li = document.createElement("li");
  if (cls) li.className = cls;
  li.innerHTML = '<span class="n">' + logN + "</span><span>" + msg + "</span>";
  var ol = $("log"); ol.insertBefore(li, ol.firstChild);
}
function result(msg, cls){
  var r = $("result");
  if (!msg){ r.className = "result"; r.textContent = ""; return; }
  r.className = "result show " + cls; r.innerHTML = msg;
}
function ping(name){ active = name; }

/* ---------- 장면 정의 ---------- */
var S = {};

/* 차별화 A 주소: 같은 데이터가 여러 파일에 */
S[1] = {
  tab: "차별화 · 주소가 두 파일에",
  title: "주소를 바꿨는데 택배는 옛날 집으로 간다",
  desc: "kim의 주소가 회원 파일에도, 배송팀이 따로 복사해 둔 배송 파일에도 있습니다. 회원 프로그램은 배송 파일이 있는지조차 모릅니다.",
  watch: "주소를 바꾼 뒤 주문해 보세요. 파일 방식에서는 배송 파일이 빨갛게 남고, 택배가 옛 주소로 갑니다.",
  init: function(){ return { member:"강남구", ship:"강남구", sent:0, wrong:0 }; },
  actions: [
    { k:"move", l:"kim 이사: 주소를 송파구로 변경", who:"회원 프로그램 · 마이페이지" },
    { k:"order", l:"kim 키보드 주문 → 배송 시작", who:"주문 → 배송 프로그램" }
  ],
  act: function(k){
    if (k === "move"){
      ping("회원");
      if (st.member === "송파구"){ result("이미 송파구로 바뀌었습니다. 주문을 눌러 보세요.", "neutral"); return; }
      st.member = "송파구";
      if (mode === "file"){
        log("회원 프로그램: <code>members.csv</code>의 kim 주소를 " + st.member + "로 수정. <code>shipping.csv</code>는 모름");
        result("회원 파일만 바뀌었습니다. 배송 파일에는 여전히 " + st.ship + "가 남아 있습니다.", "neutral");
      } else {
        st.ship = st.member;
        log("회원 프로그램: <code>UPDATE members SET address='" + st.member + "' WHERE name='kim'</code>", "good");
        result("주소는 members 테이블 한 곳에만 있습니다. 바꾸면 끝입니다.", "good");
      }
    } else {
      ping("배송"); st.sent += 1;
      if (mode === "file"){
        var ok = st.ship === st.member;
        if (!ok) st.wrong += 1;
        log("배송 프로그램: <code>shipping.csv</code>에서 kim 주소 읽기 → " + st.ship + "로 발송" + (ok ? "" : " (실제 주소는 " + st.member + ")"), ok ? "good" : "bad");
        result(ok ? "주소가 같아서 문제없이 발송했습니다. 주소를 바꾼 뒤 다시 주문해 보세요." :
          "옛날 집(" + st.ship + ")으로 발송했습니다. 같은 데이터가 두 파일에 복사되어 있고, 한쪽만 고쳐졌기 때문입니다.", ok ? "neutral" : "bad");
      } else {
        log("배송 프로그램: <code>SELECT address FROM orders JOIN members ...</code> → " + st.member + "로 발송", "good");
        result("배송은 회원 테이블을 함께 조회(JOIN)하므로 항상 현재 주소(" + st.member + ")로 갑니다.", "good");
      }
    }
  },
  progs: function(){
    return [
      { n:"회원", s: mode === "file" ? "members.csv" : "SQL" },
      { n:"주문", s:"" },
      { n:"배송", s: mode === "file" ? "shipping.csv" : "SQL", bad: mode === "file" && st.wrong > 0 }
    ];
  },
  via: function(){ return mode === "file" ? "각 프로그램이 자기 파일을 직접 열고 씀" : "모든 프로그램이 SQL로 DBMS에 부탁"; },
  storage: function(){
    if (mode === "file"){
      var stale = st.ship !== st.member;
      return '<div class="files">' +
        fileBox("members.csv", ["kim," + st.member, "lee,마포구"], { tag:"회원팀" }) +
        fileBox("shipping.csv", [stale ? { t:"kim," + st.ship, c:"bad" } : "kim," + st.ship, "lee,마포구"], { tag: stale ? "옛 주소!" : "배송팀 복사본", stale: stale }) +
        "</div>";
    }
    return dbmsBox(table("members", ["name","address"], [["kim", st.member], ["lee","마포구"]]) +
      table("orders", ["id","name","product"], st.sent ? [["1","kim","키보드"]] : []));
  },
  stats: function(){
    return [
      [mode === "file" ? 2 : 1, "kim 주소가 저장된 곳"],
      [st.sent, "배송 건수"],
      [st.wrong, "잘못 간 배송", st.wrong > 0]
    ];
  }
};

/* 문제 1: 칸 하나 추가 */
S[2] = {
  tab: "문제 1 · 칸 추가",
  title: "칸 하나 바꿀 때마다, 그 파일을 읽는 모든 코드를 같이 고쳐야 한다",
  desc: "A의 order.py가 orders.csv에 주문을 쓰고, B의 report.py와 C의 delivery.py가 그 파일을 읽습니다. B와 C의 코드는 \"한 줄은 칸 4개, 4번째가 가격\"이라고 믿고 읽습니다.",
  watch: "먼저 B와 C를 눌러 보고, A가 쿠폰 칸을 넣은 뒤 다시 눌러 보세요. 파일 방식은 B와 C가 멈추고, DBMS는 그대로입니다.",
  init: function(){ return { coupon:false, status:{ "report.py":"", "delivery.py":"" }, broken:0 }; },
  actions: [

    { k:"ok", l:"주문 처리 (정상)", who:"주문 프로그램" },
    { k:"crash", l:"주문 처리 중 2번(재고) 단계에서 전원 끄기", who:"정전" }
  ],
  act: function(k){
    ping("주문");
    var no = st.pay.length + 1;
    if (st.stockBroken && mode === "file"){ result("재고 파일이 깨져 있어서 읽을 수 없습니다. 처음 상태로 돌려 다시 해 보세요.", "bad"); log("주문 프로그램: stock.txt 읽기 실패 (파일 손상)", "bad"); return; }
    if (k === "ok"){
      st.pay.push("결제 #" + no); st.stock -= 1; st.ord.push("주문 #" + no);
      st.steps = [["1. 결제", "완료"], ["2. 재고", "완료"], ["3. 주문", "완료"]];
      log((mode === "file" ? "파일 세 개를 차례로 수정" : "BEGIN → 세 작업 → COMMIT") + ": 결제·재고·주문 모두 반영", "good");
      result("세 가지가 모두 반영되었습니다.", "good");
      return;
    }
    if (mode === "file"){
      st.pay.push("결제 #" + no); st.stockBroken = true;
      st.steps = [["1. 결제", "payments.csv에 추가 → 완료"], ["2. 재고", "stock.txt 쓰는 도중 정전 → 반만 써짐"], ["3. 주문", "실행 안 됨"]];
      log("정전: 결제 #" + no + "은 기록됐는데 주문은 없음. stock.txt는 반만 써져 읽을 수 없음", "bad");
      result("<b>고객 돈은 결제됐는데 주문은 없습니다.</b> 여러 파일의 변경을 \"전부 되거나 전부 안 되거나\"로 묶는 장치가 없기 때문입니다.", "bad");
    } else {
      st.steps = [["1. 결제", "트랜잭션 안에서 기록"], ["2. 재고", "도중 정전"], ["재시작", "COMMIT 전이었으므로 1번까지 되돌림"]];
      log("DBMS: BEGIN → 결제 기록 → 재고 수정 중 정전 → 재시작 시 COMMIT 안 된 변경을 되돌림. 결제·재고·주문 모두 그대로", "good");
      result("트랜잭션은 COMMIT까지 와야 반영됩니다. 중간에 꺼지면 <b>셋 다 없던 일</b>이 되어, 다시 시도하면 됩니다.", "good");
    }
  },
  progs: function(){ return [{ n:"주문", s:"", bad: mode === "file" && st.pay.length !== st.ord.length }]; },
  via: function(){ return mode === "file" ? "파일 세 개를 하나씩 차례로 수정" : "BEGIN; 결제; 재고; 주문; COMMIT;"; },
  storage: function(){
    if (mode === "file"){
      return '<div class="files">' +
        fileBox("payments.csv", st.pay.slice(-4), { tag:"결제" }) +
        fileBox("stock.txt", [st.stockBroken ? { t:"재고: 9▒▒ (손상)", c:"bad" } : "재고: " + st.stock], { tag: st.stockBroken ? "깨짐" : "재고", broken: st.stockBroken }) +
        fileBox("orders.csv", st.ord.slice(-4), { tag:"주문", stale: st.pay.length !== st.ord.length }) + "</div>";
    }
    return dbmsBox(table("payments", ["no"], st.pay.slice(-4).map(function(p){ return [p]; })) +
      table("stock", ["product","count"], [["키보드", String(st.stock)]]) +
      table("orders", ["no"], st.ord.slice(-4).map(function(p){ return [p]; })), "트랜잭션: COMMIT 전에는 반영되지 않음. 변경은 로그에 먼저 기록");
  },
  extra: S[5].extra,
  stats: function(){
    var diff = st.pay.length - st.ord.length;
    return [[st.pay.length, "결제 건수"], [st.ord.length, "주문 건수"], [diff, "돈만 빠진 건수", diff > 0]];
  }
};

/* ---------- 화면 그리기 ---------- */
function renderScenario(){
  var s = S[scene];
  var h = "<h2>" + esc(s.title) + "</h2><p>" + esc(s.desc) + '</p><div class="watch"><b>볼 것</b> · ' + esc(s.watch) + '</div><div class="actions">';
  s.actions.forEach(function(a){ h += '<button type="button" data-act="' + a.k + '">' + esc(a.l) + '<span class="who">' + esc(a.who) + "</span></button>"; });
  $("scenario").innerHTML = h + "</div>";
}
function render(){
  var s = S[scene];
  $("progs").innerHTML = s.progs().map(function(p){
    var c = "prog" + (p.bad ? " broken" : (p.ok ? " ok" : "")) + (active === p.n ? " active ping" : "");
    return '<div class="' + c + '"><b>' + esc(p.n) + "</b><small>" + esc(p.s || "") + "</small></div>";
  }).join("");
  active = null;
  $("via").textContent = s.via();
  $("storage").innerHTML = s.storage();
  $("extra").innerHTML = s.extra ? s.extra() : "";
  $("stats").innerHTML = s.stats().map(function(x){ return '<div class="stat"><b class="' + (x[2] ? "bad" : "") + '">' + esc(x[0]) + "</b><small>" + esc(x[1]) + "</small></div>"; }).join("");
}
function resetScene(silent){
  st = S[scene].init(); result(null);
  if (!silent) log("[" + S[scene].tab + "] " + (mode === "file" ? "파일 직접" : "DBMS") + " 방식으로 처음 상태");
  render();
}
function setScene(n){
  scene = n;
  document.querySelectorAll('[role="tab"]').forEach(function(b){ b.setAttribute("aria-selected", String(+b.dataset.s === n)); });
  renderScenario(); resetScene(false);
  if (location.hash !== "#scene-" + n) history.replaceState(null, "", "#scene-" + n);
}
function setMode(m){
  mode = m;
  document.querySelectorAll("[data-mode]").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.mode === m)); });
  resetScene(false);
}
$("scenario").addEventListener("click", function(e){
  var b = e.target.closest("[data-act]"); if (!b) return;
  S[scene].act(b.dataset.act); render();
});
document.querySelectorAll('[role="tab"]').forEach(function(b){ b.addEventListener("click", function(){ setScene(+b.dataset.s); }); });
document.querySelectorAll("[data-mode]").forEach(function(b){ b.addEventListener("click", function(){ setMode(b.dataset.mode); }); });
$("reset").addEventListener("click", function(){ resetScene(false); });
function fromHash(){ var m = /scene-([1-6])/.exec(location.hash); setScene(m ? +m[1] : 2); }
window.addEventListener("hashchange", fromHash);
fromHash();
})();
</script>
